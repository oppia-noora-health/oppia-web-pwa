version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        - env | grep -i next
        - npm run build
        - rm -rf node_modules/@swc/core-linux-x64-gnu/swc.linux-x64-gnu.node
        - rm -rf node_modules/@swc/core-linux-x64-musl/swc.linux-x64-musl.node
        - rm -rf node_modules/@esbuild
  artifacts:
    baseDirectory: .next
    files:
      - "**/*"
  cache:
    paths:
      - node_modules/**/*
